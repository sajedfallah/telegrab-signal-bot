<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#05090d" />
  <title>NEXUS Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="./styles.css?v=20260910-1215" />
  <link rel="stylesheet" href="./runtime.css?v=20260910-1215" />

  <link rel="stylesheet" href="./signals-v2.css?v=20260910-1215" />
  <link rel="stylesheet" href="./track-record.css?v=20260910-1215" />
  <link rel="stylesheet" href="./trades-v2.css?v=20260910-1215" />
  <link rel="stylesheet" href="./pricing-v2.css?v=20260910-1215" />
  <link rel="stylesheet" href="./account-v2.css?v=20260910-1215" />
  <link rel="stylesheet" href="./design-v2.css?v=20260910-1215" />

</head>
<body class="landing-active">
  <section class="nexus-landing" id="nexusLanding" aria-label="NEXUS">
    <div class="nexus-landing-inner">
      <div class="nexus-landing-brand">
        <img class="nexus-landing-logo" src="./assets/brand/nexus-mark.svg?v=20260910-1523" alt="NEXUS" decoding="async" />
        <div class="nexus-landing-wordmark">NEXUS</div>
        <div class="nexus-landing-subbrand">Trading Intelligence</div>
      </div>

      <div class="nexus-market-visual" aria-hidden="true">
        <svg class="nexus-chart-svg" viewBox="0 0 420 190" preserveAspectRatio="none">
          <defs>
            <linearGradient id="nexusLineGradient" x1="0" x2="1">
              <stop offset="0%" stop-color="#12687c" stop-opacity="0.3" />
              <stop offset="58%" stop-color="#25c9ce" stop-opacity="0.78" />
              <stop offset="100%" stop-color="#50efe0" />
            </linearGradient>
            <linearGradient id="nexusBarGradient" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#0e4f5d" stop-opacity="0.12" />
              <stop offset="100%" stop-color="#2de0d6" stop-opacity="0.88" />
            </linearGradient>
          </defs>
          <g class="nexus-chart-grid">
            <line x1="0" y1="45" x2="420" y2="45" />
            <line x1="0" y1="95" x2="420" y2="95" />
            <line x1="0" y1="145" x2="420" y2="145" />
            <line x1="70" y1="0" x2="70" y2="190" />
            <line x1="140" y1="0" x2="140" y2="190" />
            <line x1="210" y1="0" x2="210" y2="190" />
            <line x1="280" y1="0" x2="280" y2="190" />
            <line x1="350" y1="0" x2="350" y2="190" />
          </g>
          <g class="nexus-chart-bars">
            <rect x="52" y="150" width="12" height="24" rx="3" />
            <rect x="86" y="141" width="12" height="33" rx="3" />
            <rect x="120" y="146" width="12" height="28" rx="3" />
            <rect x="154" y="128" width="12" height="46" rx="3" />
            <rect x="188" y="120" width="12" height="54" rx="3" />
            <rect x="222" y="104" width="12" height="70" rx="3" />
            <rect x="256" y="92" width="12" height="82" rx="3" />
            <rect x="290" y="72" width="12" height="102" rx="3" />
            <rect x="324" y="49" width="12" height="125" rx="3" />
            <rect x="358" y="26" width="12" height="148" rx="3" />
          </g>
          <path class="nexus-chart-curve" d="M8 165 C72 164, 111 156, 153 143 S236 112, 276 87 S338 42, 398 19" />
          <circle class="nexus-chart-point" cx="398" cy="19" r="4" />
        </svg>
      </div>

      <div class="nexus-landing-copy">
        <h1 class="nexus-landing-title">هوشمند <strong>معامله کن</strong></h1>
        <p class="nexus-landing-lead">سیگنال‌های دقیق، دسترسی VIP و AutoTrade در یک تجربه یکپارچه و هوشمند.</p>
      </div>

      <div class="nexus-landing-features" aria-label="امکانات NEXUS">
        <div class="nexus-landing-feature">
          <span class="nexus-landing-feature-icon">▥</span>
          <b>سیگنال‌های دقیق</b>
          <small>فرصت‌های واقعی بازار</small>
        </div>
        <div class="nexus-landing-feature">
          <span class="nexus-landing-feature-icon">⚡</span>
          <b>AutoTrade</b>
          <small>معاملات خودکار</small>
        </div>
        <div class="nexus-landing-feature">
          <span class="nexus-landing-feature-icon">♛</span>
          <b>VIP</b>
          <small>دسترسی اختصاصی</small>
        </div>
      </div>

      <button class="nexus-landing-enter" id="enterNexus" type="button">ورود</button>
      <div class="nexus-landing-footer">آینده معاملات، هوشمندتر است</div>
    </div>
  </section>

  <div class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <img class="brand-logo" src="./assets/brand/nexus-mark.svg?v=20260910-1215" alt="NEXUS" decoding="async" />
        <div><div class="brand">NEXUS</div><div class="brand-sub">Trading Intelligence</div></div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn notification-btn" id="notificationsBtn" aria-label="اعلان‌ها"><span data-nexus-icon="bell"></span><i class="notification-badge" id="notificationBadge" hidden>0</i></button>
        <button class="icon-btn" id="langBtn" aria-label="language">FA</button>
      </div>
    </header>
    <main id="view" class="view"></main>
    <nav class="bottom-nav" aria-label="main navigation">
      <button data-route="home" class="nav-item active"><span class="nav-icon-wrap" data-nexus-icon="home"></span><small>خانه</small></button>
      <button data-route="signals" class="nav-item"><span class="nav-icon-wrap" data-nexus-icon="signals"></span><small>سیگنال‌ها</small></button>
      <button data-route="subscriptions" class="nav-item"><span class="nav-icon-wrap" data-nexus-icon="plans"></span><small>پلن‌ها</small></button>
      <button data-route="account" class="nav-item"><span class="nav-icon-wrap" data-nexus-icon="account"></span><small>حساب من</small></button>
    </nav>
  </div>

  <template id="homeTpl">
    <section class="hero card-glow">
      <div class="eyebrow">WELCOME TO NEXUS</div>
      <h1>مرکز هوشمند سیگنال و ابزارهای معاملاتی</h1>
      <p>داشبورد NEXUS در حال دریافت اطلاعات واقعی حساب شماست.</p>
    </section>
  </template>

  <template id="signalsTpl">
    <section class="page-head"><div><div class="eyebrow">SIGNALS</div><h1>سیگنال‌ها</h1></div></section>
    <div class="empty-state">در حال دریافت Signal Center...</div>
  </template>

  <template id="subscriptionsTpl">
    <section class="page-head"><div><div class="eyebrow">SUBSCRIPTIONS</div><h1>اشتراک‌ها</h1></div></section>
    <div class="empty-state">در حال دریافت پلن‌های NEXUS...</div>
  </template>

  <template id="accountTpl">
    <section class="profile-card">
      <img class="account-brand-avatar" src="./assets/brand/nexus-mark.svg?v=20260910-1215" alt="NEXUS" decoding="async" />
      <div><h2 id="userName" class="bidi-safe" dir="rtl">کاربر NEXUS</h2><p id="userHandle">Telegram User</p></div>
      <span class="badge muted">MEMBER</span>
    </section>
    <div class="empty-state">در حال دریافت Status Center...</div>
  </template>

  <template id="guideTpl">
    <section class="page-head"><div><div class="eyebrow">GUIDE</div><h1>راهنما</h1></div></section>
    <div class="stack">
      <button class="list-card"><span data-nexus-icon="chart"></span><div><b>معرفی NEXUS</b><small>آشنایی سریع با سرویس</small></div></button>
      <button class="list-card"><span data-nexus-icon="trades"></span><div><b>راهنمای نصب اکسپرت</b><small>MetaTrader 5 / License</small></div></button>
    </div>
  </template>

  <template id="supportTpl">
    <section class="page-head"><div><div class="eyebrow">SUPPORT</div><h1>پشتیبانی</h1></div></section>
    <div class="support-card"><div class="support-icon" data-nexus-icon="support"></div><h3>نیاز به کمک داری؟</h3><p>برای مسائل پرداخت، اشتراک، دسترسی کانال یا AutoTrade با تیم پشتیبانی در ارتباط باش.</p><button class="btn primary full" data-action="support">ارتباط با پشتیبانی</button></div>
  </template>

  <script src="./icons.js?v=20260910-1215"></script>
  <script src="./app.js?v=20260910-1215"></script>
  <script src="./locale-v4.js?v=20260910-1215"></script>
  <script src="./product-intelligence.js?v=20260910-1215"></script>
  <script src="./experience.js?v=20260910-1215"></script>
  <script src="./home-v2.js?v=20260910-1215"></script>
  <script src="./home-v2-nav.js?v=20260910-1215"></script>
  <script src="./signals-v2.js?v=20260910-1215"></script>
  <script src="./track-record.js?v=20260910-1215"></script>
  <script src="./trades-v2.js?v=20260910-1215"></script>
  <script src="./pricing-v2.js?v=20260910-1215"></script>
  <script src="./account-v2.js?v=20260910-1215" data-nexus-account-v2="1"></script>
  <script src="./ui-fixes.js?v=20260910-1215"></script>
  <script src="./purchase-flow-v4.js?v=20260910-1215"></script>
  <script src="./compat-v4.js?v=20260910-1215"></script>
  <script src="./landing-v5.js?v=20260910-1707"></script>
</body>
</html>
