<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>NEXUS Test Lab</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#081018;--card:#101a24;--line:#253443;--text:#f3f6f9;--muted:#91a0ad;--accent:#27d17f;--danger:#ff5964}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}.wrap{max-width:680px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.badge{padding:6px 10px;border:1px solid var(--accent);border-radius:999px;color:var(--accent);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}h1{font-size:20px;margin:0}.muted{color:var(--muted);font-size:12px;line-height:1.8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;color:var(--muted);font-size:12px;margin:3px 0 6px}input,select,button{width:100%;border-radius:10px;border:1px solid var(--line);background:#0b141d;color:var(--text);padding:11px;font-size:14px}button{background:var(--accent);color:#06110c;border:0;font-weight:700;cursor:pointer}.danger{color:var(--danger)}.ok{color:var(--accent)}pre{white-space:pre-wrap;word-break:break-word;background:#09121a;border-radius:10px;padding:12px;font-size:12px;direction:ltr;text-align:left}.targets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.target{background:#0b141d;border:1px solid var(--line);border-radius:10px;padding:9px;font-size:12px}@media(max-width:520px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="head"><div><h1>NEXUS Test Lab</h1><div class="muted">Demo MT5 + Test Channel</div></div><span class="badge">TEST ONLY</span></div>
  <div class="card"><div id="status" class="muted">در حال بررسی محیط تست...</div></div>
  <div class="card">
    <div class="grid">
      <div><label>Symbol</label><input id="symbol" value="XAUUSD" /></div>
      <div><label>Direction</label><select id="direction"><option>BUY</option><option selected>SELL</option></select></div>
      <div><label>Timeframe</label><select id="timeframe"><option>M1</option><option selected>M5</option><option>M15</option><option>M30</option><option>H1</option><option>H4</option></select></div>
      <div><label>Trailing</label><select id="trailing"><option>NEXUS_TRAIL_01</option><option>NEXUS_TRAIL_02</option><option>NEXUS_TRAIL_03</option><option>NEXUS_TRAIL_04</option><option>NEXUS_TRAIL_05</option><option>NEXUS_TRAIL_06</option><option selected>NEXUS_TRAIL_07</option></select></div>
      <div><label>Entry</label><input id="entry" inputmode="decimal" placeholder="4350.00" /></div>
      <div><label>Stop Loss</label><input id="sl" inputmode="decimal" placeholder="4360.00" /></div>
      <div><label>Volume Mode</label><select id="volumeMode"><option selected>FIXED</option><option>RISK</option></select></div>
      <div><label id="sizeLabel">Fixed Lot</label><input id="size" inputmode="decimal" value="0.02" /></div>
      <div class="full"><label>Destination</label><input value="TEST CHANNEL" disabled /></div>
    </div>
  </div>
  <div class="card"><div class="muted" style="margin-bottom:8px">Target Preview — 1R / 1.5R / 2R / 3R</div><div id="targets" class="targets"></div></div>
  <div class="card"><button id="publish">صدور سیگنال تست</button><div id="result" class="muted" style="margin-top:12px"></div></div>
</div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
const $=id=>document.getElementById(id); const initData=tg?.initData||'';
const headers=()=>({'Content-Type':'application/json','X-Telegram-Init-Data':initData});
const num=id=>Number($(id).value);
function calc(){const e=num('entry'),s=num('sl'),side=$('direction').value;if(!(e>0&&s>0)){ $('targets').innerHTML='';return [];}const r=Math.abs(e-s);const sign=side==='BUY'?1:-1;const vals=[1,1.5,2,3].map(x=>e+sign*r*x);$('targets').innerHTML=vals.map((v,i)=>`<div class="target">TP${i+1}: <b>${v.toFixed(2)}</b></div>`).join('');return vals;}
['entry','sl','direction'].forEach(id=>$(id).addEventListener('input',calc));
$('volumeMode').addEventListener('change',()=>{$('sizeLabel').textContent=$('volumeMode').value==='FIXED'?'Fixed Lot':'Risk %';$('size').value=$('volumeMode').value==='FIXED'?'0.02':'1';});
async function bootstrap(){try{const r=await fetch('/miniapp/api/admin/test/bootstrap',{headers:headers()});const j=await r.json();const mt5=j.mt5||{};$('status').innerHTML=`Test MT5: <b class="${mt5.online?'ok':'danger'}">${mt5.status||'OFFLINE'}</b> · Account: <b>${mt5.account_number||'NOT CONFIGURED'}</b> · Test Channel: <b>${j.test_channel_configured?'READY':'NOT CONFIGURED'}</b> · Allowlist: <b>${j.account_allowlisted?'YES':'NO'}</b>`;if(!j.ok)$('publish').disabled=true;}catch(e){$('status').innerHTML='<span class="danger">Test Lab bootstrap failed</span>'; $('publish').disabled=true;}}
$('publish').addEventListener('click',async()=>{const e=num('entry'),s=num('sl');if(!(e>0&&s>0)){alert('Entry / SL را وارد کن');return;}const mode=$('volumeMode').value;const rid='TEST:'+Date.now()+':'+Math.random().toString(36).slice(2,10);const body={symbol:$('symbol').value.trim().toUpperCase(),direction:$('direction').value,entry:e,stop_loss:s,destination:'FREE',request_id:rid,timeframe:$('timeframe').value,setup_mode:'MANUAL',trailing_code:$('trailing').value,volume_mode:mode,lot_size:mode==='FIXED'?num('size'):null,risk_percent:mode==='RISK'?num('size'):null};$('publish').disabled=true;$('result').textContent='در حال ارسال...';try{const r=await fetch('/miniapp/api/admin/signals',{method:'POST',headers:headers(),body:JSON.stringify(body)});const text=await r.text();let j;try{j=JSON.parse(text)}catch{j={raw:text}}if(!r.ok)throw new Error(j.detail||text);$('result').innerHTML=`<span class="ok">Signal queued for Test Lab.</span><pre>${JSON.stringify({status:j.status,signal:j.signal?.code||j.signal?.id,test_mt5_account:j.test_mt5_account,test_lab:j.test_lab},null,2)}</pre>`;}catch(e){$('result').innerHTML=`<span class="danger">${String(e.message||e)}</span>`;}finally{$('publish').disabled=false;}});
calc();bootstrap();
</script>
</body>
</html>
