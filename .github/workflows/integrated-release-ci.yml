name: NEXUS v0.6.5 Integrated Release CI

on:
  push:
    branches:
      - feature/v065-integrated-release
      - integration/nexus-v065-platform
  pull_request:
    branches:
      - feature/v065-integrated-release
      - integration/nexus-v065-platform
  workflow_dispatch:

jobs:
  integrated-release-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_TOKEN: "123456:TESTTOKEN"
      ADMIN_IDS: "123456789"
      PUBLIC_CHANNEL_ID: "-1001234567890"
      PUBLIC_CHANNEL_URL: "https://t.me/nexus_test_public"
      FREE_CHANNEL_URL: "https://t.me/nexus_test_free"
      VIP_CHANNEL_ID: "-1009876543210"
      SUPPORT_USERNAME: "https://t.me/nexus_support"
      PAYMENT_CARD: "0000000000000000"
      PAYMENT_OWNER: "NEXUS"
      CONTENT_AGENTS_ENABLED: "false"
      ACADEMY_CHANNEL_ID: "-1003994692349"
      ACADEMY_CHANNEL_URL: "https://t.me/nexus_ict_learning"
      NEXUS_FOLDER_URL: "https://t.me/addlist/ASXi4-91edg2YzA8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile integrated runtime
        run: python -m compileall -q app run.py run_api.py

      - name: Platform integration contract tests
        run: |
          python -m pytest tests/test_admin_web_integrated_runtime.py -q
          python -m pytest tests/test_miniapp_integrated_runtime.py -q
          python -m pytest tests/test_web_chart_capture_integrated.py -q

      - name: Focused new feature tests
        run: |
          python -m pytest tests/test_agentic_content_mvp.py -q
          python -m pytest tests/test_nexus_hub_academy.py -q
          python -m pytest tests/test_autotrade_user_lifecycle.py -q
          python -m pytest tests/test_autotrade_cleanup_runtime.py -q

      - name: Full production regression suite
        run: python -m pytest tests -q
