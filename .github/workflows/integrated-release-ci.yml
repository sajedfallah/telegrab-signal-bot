name: NEXUS Integrated Release CI

on:
  push:
    branches:
      - feature/v065-integrated-release
      - integration/v066-release-reconcile
  pull_request:
    branches:
      - feature/v065-integrated-release
      - release/nexus-v0.6.5
      - integration/v066-release-reconcile
  workflow_dispatch:

jobs:
  integrated-release-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_TOKEN: "123456:TESTTOKEN"
      ADMIN_IDS: "123456789"
      PUBLIC_CHANNEL_ID: "-1001234567890"
      PUBLIC_CHANNEL_URL: "https://t.me/nexus_test_public"
      FREE_CHANNEL_URL: "https://t.me/nexus_test_free"
      VIP_CHANNEL_ID: "-1009876543210"
      SUPPORT_USERNAME: "https://t.me/nexus_support"
      PAYMENT_CARD: "0000000000000000"
      PAYMENT_OWNER: "NEXUS"
      CONTENT_AGENTS_ENABLED: "false"
      ACADEMY_CHANNEL_ID: "-1003994692349"
      ACADEMY_CHANNEL_URL: "https://t.me/nexus_ict_learning"
      NEXUS_FOLDER_URL: "https://t.me/addlist/ASXi4-91edg2YzA8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile integrated runtime
        run: python -m compileall -q app run.py run_api.py scripts/diagnose_live_pnl.py

      - name: Admin and Customer Mini App release checks
        run: |
          node --check miniapp/admin-signal.js
          node --check miniapp/admin-v066-overlay.js
          node --check miniapp/signals-v2.js
          git diff --check

      - name: Focused v066 release tests
        run: |
          python -m pytest tests/test_miniapp_admin_signal_controls.py -q
          python -m pytest tests/test_miniapp_live_pnl.py -q
          python -m pytest tests/test_miniapp_landing_v5.py -q
          python scripts/diagnose_live_pnl.py --help > /dev/null

      - name: Full production regression suite
        run: python -m pytest tests -q
