name: Provider Panel CI

on:
  pull_request:
    paths:
      - 'provider_panel/**'
      - 'app/provider_panel_api.py'
      - 'app/provider_credentials.py'
      - 'app/provider_lifecycle.py'
      - 'app/provider_lifecycle_api.py'
      - 'app/provider_reconciliation.py'
      - 'app/provider_reconciliation_api.py'
      - 'app/provider_subscribers.py'
      - 'app/provider_subscribers_api.py'
      - 'app/provider_revenue.py'
      - 'app/provider_revenue_api.py'
      - 'app/provider_reports.py'
      - 'app/provider_reports_api.py'
      - 'app/provider_branding.py'
      - 'app/provider_branding_api.py'
      - 'app/provider_permissions.py'
      - 'app/provider_publish.py'
      - 'app/signal_domain.py'
      - 'app/telegram_tenant_domain.py'
      - 'app/telegram_webapp_auth.py'
      - 'app/combined_api.py'
      - 'app/tenancy.py'
      - 'scripts/provider_domain_migration.py'
      - 'tests/test_provider_domain_migration.py'
      - 'tests/test_provider_panel_static.py'
      - 'tests/test_provider_panel_api.py'
      - 'tests/test_provider_credentials.py'
      - 'tests/test_provider_lifecycle.py'
      - 'tests/test_provider_reconciliation.py'
      - 'tests/test_provider_subscribers.py'
      - 'tests/test_provider_subscribers_api.py'
      - 'tests/test_provider_revenue.py'
      - 'tests/test_provider_revenue_api.py'
      - 'tests/test_provider_reports.py'
      - 'tests/test_provider_reports_api.py'
      - 'tests/test_provider_branding.py'
      - 'tests/test_provider_branding_api.py'
      - 'tests/test_provider_permissions.py'
      - 'tests/test_provider_publish.py'
      - 'tests/test_provider_publish_api.py'
      - 'tests/test_provider_telegram_destination_api.py'
      - 'tests/test_signal_domain.py'
      - 'tests/test_telegram_tenant_domain.py'
      - '.github/workflows/provider-panel-ci.yml'
  push:
    branches:
      - 'feature/provider-panel-ui-v1'
    paths:
      - 'provider_panel/**'
      - 'app/provider_panel_api.py'
      - 'app/provider_credentials.py'
      - 'app/provider_lifecycle.py'
      - 'app/provider_lifecycle_api.py'
      - 'app/provider_reconciliation.py'
      - 'app/provider_reconciliation_api.py'
      - 'app/provider_subscribers.py'
      - 'app/provider_subscribers_api.py'
      - 'app/provider_revenue.py'
      - 'app/provider_revenue_api.py'
      - 'app/provider_reports.py'
      - 'app/provider_reports_api.py'
      - 'app/provider_branding.py'
      - 'app/provider_branding_api.py'
      - 'app/provider_permissions.py'
      - 'app/provider_publish.py'
      - 'app/signal_domain.py'
      - 'app/telegram_tenant_domain.py'
      - 'app/telegram_webapp_auth.py'
      - 'app/combined_api.py'
      - 'app/tenancy.py'
      - 'scripts/provider_domain_migration.py'
      - 'tests/test_provider_domain_migration.py'
      - 'tests/test_provider_panel_static.py'
      - 'tests/test_provider_panel_api.py'
      - 'tests/test_provider_credentials.py'
      - 'tests/test_provider_lifecycle.py'
      - 'tests/test_provider_reconciliation.py'
      - 'tests/test_provider_subscribers.py'
      - 'tests/test_provider_subscribers_api.py'
      - 'tests/test_provider_revenue.py'
      - 'tests/test_provider_revenue_api.py'
      - 'tests/test_provider_reports.py'
      - 'tests/test_provider_reports_api.py'
      - 'tests/test_provider_branding.py'
      - 'tests/test_provider_branding_api.py'
      - 'tests/test_provider_permissions.py'
      - 'tests/test_provider_publish.py'
      - 'tests/test_provider_publish_api.py'
      - 'tests/test_provider_telegram_destination_api.py'
      - 'tests/test_signal_domain.py'
      - 'tests/test_telegram_tenant_domain.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest fastapi pydantic aiogram httpx cryptography
      - name: Validate Provider tenant, migration, subscribers, revenue, reports, branding, RBAC, publish, lifecycle and reconciliation contracts
        run: python -m pytest -q tests/test_provider_domain_migration.py tests/test_provider_panel_static.py tests/test_provider_panel_api.py tests/test_provider_credentials.py tests/test_provider_lifecycle.py tests/test_provider_reconciliation.py tests/test_provider_subscribers.py tests/test_provider_subscribers_api.py tests/test_provider_revenue.py tests/test_provider_revenue_api.py tests/test_provider_reports.py tests/test_provider_reports_api.py tests/test_provider_branding.py tests/test_provider_branding_api.py tests/test_provider_permissions.py tests/test_provider_publish.py tests/test_provider_publish_api.py tests/test_provider_telegram_destination_api.py tests/test_signal_domain.py tests/test_telegram_tenant_domain.py tests/test_phase1_tenancy.py
      - name: Python syntax check
        run: python -m py_compile scripts/provider_domain_migration.py app/provider_panel_api.py app/provider_credentials.py app/provider_lifecycle.py app/provider_lifecycle_api.py app/provider_reconciliation.py app/provider_reconciliation_api.py app/provider_subscribers.py app/provider_subscribers_api.py app/provider_revenue.py app/provider_revenue_api.py app/provider_reports.py app/provider_reports_api.py app/provider_branding.py app/provider_branding_api.py app/provider_permissions.py app/provider_publish.py app/signal_domain.py app/telegram_tenant_domain.py app/telegram_webapp_auth.py app/combined_api.py app/tenancy.py
      - name: JavaScript syntax check
        run: node --check provider_panel/app.js && node --check provider_panel/branding.js
