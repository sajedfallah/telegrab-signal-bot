name: Branch Housekeeping

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-merged-head:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branch only when no open PR depends on it
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.payload.pull_request.head.ref;

            const dependents = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: branch,
              per_page: 100,
            });

            if (dependents.length > 0) {
              core.notice(`Keeping ${branch}; ${dependents.length} open PR(s) still use it as base.`);
              return;
            }

            await github.rest.git.deleteRef({
              owner,
              repo,
              ref: `heads/${branch}`,
            });

            core.notice(`Deleted merged branch ${branch}.`);
