name: V37 Canonical Signal Visual CI

on:
  push:
    branches:
      - bugfix/miniapp-canonical-signal-visual-v37
  workflow_dispatch:

jobs:
  v37-chart-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile
        run: python -m compileall -q app
      - name: Canonical visual regression
        run: |
          python -m pytest tests/test_unified_signal_visual_v28.py tests/test_publication_consistency_v34.py tests/test_broker_chart_fallback_v26.py -q
