name: Close Reply Hardening

on:
  push:
    branches:
      - fix/v065-close-reply-hardening
    paths-ignore:
      - "docs/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Validate checked-in runtime env
        run: |
          python - <<'PY'
          from app.config import settings
          assert settings.bot_token
          assert settings.admin_ids
          assert settings.public_channel_id < 0
          assert int(settings.free_channel_target) < 0
          assert settings.vip_channel_id < 0
          assert settings.nexus_admin_mt5_accounts
          assert settings.nexus_admin_token
          print('runtime env load: PASS')
          print('free target:', settings.free_channel_target)
          print('vip target:', settings.vip_channel_id)
          print('admin MT5 account count:', len(settings.nexus_admin_mt5_accounts))
          PY
      - name: Verify Telegram Bot API and channel posting permissions
        run: python scripts/diagnose_close_reply.py
      - name: Compile Python source
        run: python -m compileall -q app tests scripts
      - name: Close/reconciliation regression
        run: python -m pytest -q tests/test_mt5_history_reconciliation.py
      - name: Full regression suite
        run: python -m pytest -q
