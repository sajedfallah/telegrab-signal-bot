name: Import NEXUS v7 source

on:
  push:
    paths:
      - ".bootstrap/v7clean/TRIGGER"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild source archive
        shell: bash
        run: |
          cat .bootstrap/v7clean/part* > /tmp/nexus_v7.b64
          base64 -d /tmp/nexus_v7.b64 > /tmp/nexus_v7.tar.xz
          tar -xJf /tmp/nexus_v7.tar.xz -C .
          rm -rf .bootstrap

      - name: Commit imported v7.0 source
        shell: bash
        run: |
          git config user.name "nexus-v7-import"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import NEXUS v7.0 canonical source" || exit 0
          git push
