name: Agentic Content CI

on:
  push:
    branches:
      - main
      - feature/content-editorial-taxonomy
      - feature/nexus-hub-academy-channel
  pull_request:
    branches:
      - main

jobs:
  content-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_TOKEN: "123456:TESTTOKEN"
      ADMIN_IDS: "123456789"
      PUBLIC_CHANNEL_ID: "-1001234567890"
      PUBLIC_CHANNEL_URL: "https://t.me/nexus_test_public"
      FREE_CHANNEL_URL: "https://t.me/nexus_test_free"
      VIP_CHANNEL_ID: "-1009876543210"
      SUPPORT_USERNAME: "https://t.me/nexus_support"
      PAYMENT_CARD: "0000000000000000"
      PAYMENT_OWNER: "NEXUS"
      CONTENT_AGENTS_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile content and portal runtime
        run: python -m compileall -q app/content app/portal.py app/portal_runtime.py app/ecosystem.py run.py

      - name: Run agentic content tests
        run: python -m pytest tests/test_agentic_content_mvp.py -q

      - name: Run NEXUS hub and Academy tests
        run: python -m pytest tests/test_nexus_hub_academy.py -q

      - name: Run core UI navigation regression
        run: python -m pytest tests/test_v712_ui_navigation.py -q

# This workflow intentionally uses dummy runtime configuration and never reads production secrets.
