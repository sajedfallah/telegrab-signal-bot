name: Repository Governance CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Signal Agent Release A tests
        run: python -m pytest -q tests/test_signal_agent_market_data_a.py

      - name: Verify repository contract
        shell: python
        run: |
          import json
          import pathlib
          import subprocess
          import sys

          required = [
              "README.md",
              "CONTRIBUTING.md",
              "LICENSE",
              ".gitignore",
              "miniapp/vercel.json",
          ]
          missing = [path for path in required if not pathlib.Path(path).is_file()]
          if missing:
              print("Missing required files:", ", ".join(missing))
              sys.exit(1)

          with open("miniapp/vercel.json", "r", encoding="utf-8") as handle:
              json.load(handle)

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          bad = []
          for path in tracked:
              lower = path.lower()
              name = pathlib.PurePosixPath(path).name
              if name == ".env":
                  bad.append(path); continue
              if name.startswith(".env.") and name != ".env.example":
                  bad.append(path); continue
              if lower.endswith((".db", ".sqlite", ".sqlite3")):
                  bad.append(path)

          if bad:
              print("Forbidden tracked runtime files:"); print("\n".join(bad)); sys.exit(1)
          print("Repository governance contract: PASS")
