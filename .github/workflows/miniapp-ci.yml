name: NEXUS Mini App CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/nexus-miniapp-ui-v1
      - feature/miniapp-cx-v2-p0-shell

jobs:
  miniapp-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_TOKEN: "123456:TESTTOKEN"
      BOT_USERNAME: "nexus_test_bot"
      ADMIN_IDS: "123456789"
      PUBLIC_CHANNEL_ID: "-1001234567890"
      PUBLIC_CHANNEL_URL: "https://t.me/nexus_test_public"
      FREE_CHANNEL_URL: "https://t.me/nexus_test_free"
      VIP_CHANNEL_ID: "-1003900670697"
      SUPPORT_USERNAME: "https://t.me/nexus_support"
      PAYMENT_CARD: "0000000000000000"
      PAYMENT_OWNER: "NEXUS"
      USDT_WALLET: "TEST_WALLET"
      USDT_NETWORK: "TRC20"
      CONTENT_AGENTS_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile backend
        run: python -m compileall -q app run_api.py

      - name: Check Mini App JavaScript syntax
        run: |
          for file in miniapp/*.js; do
            node --check "$file"
          done

      - name: Run Mini App integration and regression tests
        run: |
          python -m pytest \
            tests/test_miniapp_api.py \
            tests/test_miniapp_checkout.py \
            tests/test_miniapp_performance.py \
            tests/test_miniapp_trades.py \
            tests/test_miniapp_access_ui_fixes.py \
            -q
